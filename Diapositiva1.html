<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2º DAW – Charla Inicial con el Tutor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Source Sans Pro", sans-serif;
        color: #333;
        overflow: hidden;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
      .slide {
        width: 1280px;
        min-height: 720px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(rgba(0, 32, 63, 0.85), rgba(0, 32, 63, 0.85)),
          url("https://sfile.chatglm.cn/images-ppt/4823cf2513ba.jpg");
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border-radius: 15px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        margin: 20px;
    }
      .content {
        text-align: center;
        z-index: 2;
        max-width: 80%;
      }
      .title {
        font-size: 64px;
        font-weight: 700;
        margin-bottom: 20px;
        color: #ffffff;
        line-height: 1.2;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }
      .subtitle {
        font-size: 28px;
        font-weight: 400;
        color: #a3d4ff;
        margin-bottom: 40px;
        letter-spacing: 1px;
      }
      .icon-container {
        margin-top: 40px;
        display: flex;
        gap: 30px;
        justify-content: center;
      }
      .icon-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.3s ease;
      }
      .icon-item:hover {
        transform: translateY(-5px);
      }
      .icon-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
        border: 2px solid rgba(78, 205, 196, 0.5);
      }
      .icon-circle i {
        font-size: 36px;
        color: #4ecdc4;
      }
      .icon-label {
        font-size: 16px;
        color: #ffffff;
        opacity: 0.9;
      }
      .highlight {
        color: #4ecdc4;
        font-weight: 600;
      }
      .decorative-element {
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(78, 205, 196, 0.1) 0%,
          rgba(0, 0, 0, 0) 70%
        );
        z-index: 1;
      }
      .decorative-element-1 {
        top: -100px;
        right: -100px;
      }
      .decorative-element-2 {
        bottom: -150px;
        left: -100px;
      }
      .back-button {
        position: absolute;
        top: 20px;
        right: 20px;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.9) 0%, rgba(118, 75, 162, 0.9) 100%);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 25px;
        cursor: pointer;
        font-family: "Source Sans Pro", sans-serif;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        z-index: 1000;
      }
      
      .back-button:hover {
        background: linear-gradient(135deg, rgba(118, 75, 162, 0.9) 0%, rgba(102, 126, 234, 0.9) 100%);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }
      
.back-button i {
  font-size: 16px;
}

 

    </style>
  </head>
  <body>
    <div class="slide">
      <a href="index.html" class="back-button" title="Volver al inicio">
        <i class="fas fa-arrow-left"></i>
        Volver
      </a>
      <div class="decorative-element decorative-element-1"></div>
      <div class="decorative-element decorative-element-2"></div>

  <div class="content">
        <h1 class="title">2º DAW – Curso 2025 /2026</h1>
        <p class="subtitle">
          Ciclo Formativo de Grado Superior en
          <span class="highlight">Desarrollo de Aplicaciones Web</span>
        </p>

        <div class="icon-container">
          <div class="icon-item">
            <div class="icon-circle">
              <i class="fas fa-code"></i>
            </div>
            <div class="icon-label">Desarrollo</div>
          </div>

          <div class="icon-item">
            <div class="icon-circle">
              <i class="fas fa-laptop-code"></i>
            </div>
            <div class="icon-label">Tecnología</div>
          </div>

          <div class="icon-item">
            <div class="icon-circle">
              <i class="fas fa-rocket"></i>
            </div>
            <div class="icon-label">Innovación</div>
          </div>

          <div class="icon-item">
            <div class="icon-circle">
              <i class="fas fa-briefcase"></i>
            </div>
            <div class="icon-label">Profesional</div>
  </div>
      
</div>
      </div>
    </div>
  </body>
</html>
